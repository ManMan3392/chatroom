name: Deploy to SSH

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload files to server (scp)
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "./"
          target: "/root/chatroomWebview"
          strip_components: 0
          exclude: |
            .git
            .github
            node_modules
            **/node_modules
            .env

      - name: Run remote install & restart
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            # target path - adjust if needed
            TARGET_DIR=/root/chatroomWebview
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR" || exit 1

            # Backup .env if present
            if [ -f .env ]; then
              ts="$(date +%s)"
              cp .env .env.bak."${ts}" || true
              echo "[deploy] existing .env backed up to .env.bak.${ts}"
            fi

            # Ensure uploads/dirs exist (adjust as your app needs)
            mkdir -p apps/api/uploads || true
            chmod -R 755 apps/api/uploads || true
            echo "[deploy] ensured uploads exists (preserved)"

            # Install dependencies (prefer pnpm if available)
            if command -v pnpm >/dev/null 2>&1; then
              pnpm install --frozen-lockfile || pnpm install
            elif command -v npm >/dev/null 2>&1; then
              npm ci || npm install
            fi

            # Restart with pm2 (adjust process name and start command as needed)
            if pm2 describe chatroomWebview >/dev/null 2>&1; then
              pm2 restart chatroomWebview
            else
              # try starting index.js, or fallback to npm start
              pm2 start index.js --name chatroomWebview || pm2 start npm --name chatroomWebview -- start
            fi

            # Persist pm2 process list
            pm2 save || true
